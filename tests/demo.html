<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>V2.1.1 – Testdaten</title>
<style>body{margin:0;padding-left:56px;background:#17191b;font-family:sans-serif}.demo-label{height:56px;box-sizing:border-box;padding:8px 20px;color:#aaa;font-size:12px}</style>
<div class="demo-label">V2.1.1 · Darstellung mit künstlichen Testdaten · kein Live-Zugriff auf Home Assistant</div>
<script type="module">
await import(new URLSearchParams(location.search).has('bundle') ? '../dist/Homedashboard-iPad.js' : '../www/home-dashboard/home-dashboard.js');
import {dayWindow} from '../www/home-dashboard/data.js';
class RadarMock extends HTMLElement {setConfig(config){this.config=structuredClone(config);} set hass(h){this.innerHTML='<div style="height:100%;display:grid;place-content:center;background:radial-gradient(ellipse at 65% 35%,#397b8c,#273f44 40%,#526256);color:white;text-align:center">Regenradar<br><small>Platzhalter im Offline-Test</small></div>';}}
customElements.define('weather-radar-card',RadarMock);
window.loadCardHelpers=async()=>({createCardElement(config){const c=document.createElement('weather-radar-card');c.setConfig(config);return c;}});
window.calls=[];
const card=document.createElement('home-dashboard');card.setConfig({"type": "custom:home-dashboard", "weather": "weather.demo", "battery_soc": "sensor.demo_storage_soc", "rooms": [["Raum 1", "sensor.demo_room_1_temperature", "sensor.demo_room_1_humidity", "sensor.demo_room_1_co2"], ["Raum 2", "sensor.demo_room_2_temperature", "sensor.demo_room_2_humidity", "sensor.demo_room_2_co2"], ["Raum 3", "sensor.demo_room_3_temperature", "sensor.demo_room_3_humidity", null], ["Raum 4", "sensor.demo_room_4_temperature", "sensor.demo_room_4_humidity", "sensor.demo_room_4_co2"], ["Raum 5", "sensor.demo_room_5_temperature", "sensor.demo_room_5_humidity", "sensor.demo_room_5_co2"], ["Raum 6", "sensor.demo_room_6_temperature", "sensor.demo_room_6_humidity", "sensor.demo_room_6_co2"], ["Raum 7", "sensor.demo_room_7_temperature", "sensor.demo_room_7_humidity", "sensor.demo_room_7_co2"], ["Raum 8", "sensor.demo_room_8_temperature", "sensor.demo_room_8_humidity", null, "sensor.demo_room_8_rain"]], "allow_night_action": false, "night_script": "script.demo_good_night", "calendars": ["calendar.demo_1", "calendar.demo_2", "calendar.demo_3", "calendar.demo_4", "calendar.demo_5"], "price_factor": 100, "radar": {"type": "custom:weather-radar-card", "height": "100%", "zoom_level": 8, "data_source": "DWD", "past_minutes": 60, "forecast_minutes": 60, "forecast_refresh_minutes": 15}, "entities": {"current_price": "sensor.demo_current_price", "pv_power": "sensor.demo_pv_power", "pv_energy_today": "sensor.demo_pv_energy_today", "vehicle_range": "sensor.demo_vehicle_range", "vehicle_soc": "sensor.demo_vehicle_soc", "vehicle_plug": "binary_sensor.demo_vehicle_plug", "vehicle_charging": "binary_sensor.demo_vehicle_charging", "vehicle_target_soc": "sensor.demo_vehicle_target_soc", "vehicle_charged_today": "sensor.demo_vehicle_charged_today"}, "vehicle_name": "Demoauto"});document.body.append(card);
const states={};for(const [name,temp,hum,co2] of card._config.rooms){states[temp]={state:'21.4'};states[hum]={state:'57'};if(co2)states[co2]={state:'840'};}
Object.assign(states,{
 'sensor.demo_room_8_rain':{state:'2.4',attributes:{unit_of_measurement:'mm'}},
 'weather.demo':{state:'partlycloudy',attributes:{temperature:11}},
 'sensor.demo_current_price':{state:'28.2'},
 'sensor.demo_vehicle_soc':{state:'59'},'sensor.demo_vehicle_target_soc':{state:'80'},
 'sensor.demo_vehicle_range':{state:'251'},'sensor.demo_vehicle_charged_today':{state:'0'},
 'binary_sensor.demo_vehicle_plug':{state:'off'},'binary_sensor.demo_vehicle_charging':{state:'off'},
 'sensor.demo_storage_soc':{state:'73'},
 'sensor.demo_pv_power':{state:'184'},'sensor.demo_pv_energy_today':{state:'1.23'},
 'script.demo_good_night':{state:'off'},
});
const w=dayWindow(new Date(),'Europe/Berlin');
window.mockHass={config:{time_zone:'Europe/Berlin'},states,
 async callWS(msg){window.calls.push(msg);
 if(msg.domain==='tibber')return {response:{prices:{Testhaus:Array.from({length:192},(_,i)=>({start_time:new Date(w.start.getTime()+i*900000).toISOString(),price:(28+8*Math.sin(i/12))/100}))}}};
 if(msg.domain==='calendar')return {response:{[msg.target.entity_id]:{events:[{summary:msg.target.entity_id==='calendar.demo_1'?'Beispieltermin':'Testeintrag',start:w.today,end:w.tomorrow}]}}};
 if(msg.domain==='weather')return {response:{'weather.demo':{forecast:Array.from({length:msg.service_data.type==='hourly'?8:5},(_,i)=>({datetime:new Date(Date.now()+i*(msg.service_data.type==='hourly'?3600000:86400000)).toISOString(),condition:i%2?'rainy':'partlycloudy',temperature:11+i,templow:5+i}))}}};
 throw Error('Unexpected request');},
 async callApi(){return card._config.rooms.map(r=>[{entity_id:r[1],state:'20.1'},{state:'22.5'}]);},
 async callService(domain,service,data){window.calls.push({domain,service,data});}
};
window.demoConfig={"type": "custom:home-dashboard", "weather": "weather.demo", "battery_soc": "sensor.demo_storage_soc", "rooms": [["Raum 1", "sensor.demo_room_1_temperature", "sensor.demo_room_1_humidity", "sensor.demo_room_1_co2"], ["Raum 2", "sensor.demo_room_2_temperature", "sensor.demo_room_2_humidity", "sensor.demo_room_2_co2"], ["Raum 3", "sensor.demo_room_3_temperature", "sensor.demo_room_3_humidity", null], ["Raum 4", "sensor.demo_room_4_temperature", "sensor.demo_room_4_humidity", "sensor.demo_room_4_co2"], ["Raum 5", "sensor.demo_room_5_temperature", "sensor.demo_room_5_humidity", "sensor.demo_room_5_co2"], ["Raum 6", "sensor.demo_room_6_temperature", "sensor.demo_room_6_humidity", "sensor.demo_room_6_co2"], ["Raum 7", "sensor.demo_room_7_temperature", "sensor.demo_room_7_humidity", "sensor.demo_room_7_co2"], ["Raum 8", "sensor.demo_room_8_temperature", "sensor.demo_room_8_humidity", null, "sensor.demo_room_8_rain"]], "allow_night_action": false, "night_script": "script.demo_good_night", "calendars": ["calendar.demo_1", "calendar.demo_2", "calendar.demo_3", "calendar.demo_4", "calendar.demo_5"], "price_factor": 100, "radar": {"type": "custom:weather-radar-card", "height": "100%", "zoom_level": 8, "data_source": "DWD", "past_minutes": 60, "forecast_minutes": 60, "forecast_refresh_minutes": 15}, "entities": {"current_price": "sensor.demo_current_price", "pv_power": "sensor.demo_pv_power", "pv_energy_today": "sensor.demo_pv_energy_today", "vehicle_range": "sensor.demo_vehicle_range", "vehicle_soc": "sensor.demo_vehicle_soc", "vehicle_plug": "binary_sensor.demo_vehicle_plug", "vehicle_charging": "binary_sensor.demo_vehicle_charging", "vehicle_target_soc": "sensor.demo_vehicle_target_soc", "vehicle_charged_today": "sensor.demo_vehicle_charged_today"}, "vehicle_name": "Demoauto"};
window.dashboard=card;card.hass=window.mockHass;
</script></html>

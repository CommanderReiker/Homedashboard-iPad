title: Home Dashboard
views:
- title: Zuhause
  path: home
  panel: true
  cards:
  - type: custom:home-dashboard
    weather: weather.demo
    battery_soc: sensor.demo_storage_soc
    # Optional: eigene PM2.5-Entität, auf Kartenebene
    pm25: sensor.demo_pm25
    rooms:
    - - Raum 1
      - sensor.demo_room_1_temperature
      - sensor.demo_room_1_humidity
      - sensor.demo_room_1_co2
    - - Raum 2
      - sensor.demo_room_2_temperature
      - sensor.demo_room_2_humidity
      - sensor.demo_room_2_co2
    - - Raum 3
      - sensor.demo_room_3_temperature
      - sensor.demo_room_3_humidity
      - null
    - - Raum 4
      - sensor.demo_room_4_temperature
      - sensor.demo_room_4_humidity
      - sensor.demo_room_4_co2
    - - Raum 5
      - sensor.demo_room_5_temperature
      - sensor.demo_room_5_humidity
      - sensor.demo_room_5_co2
    - - Raum 6
      - sensor.demo_room_6_temperature
      - sensor.demo_room_6_humidity
      - sensor.demo_room_6_co2
    - - Raum 7
      - sensor.demo_room_7_temperature
      - sensor.demo_room_7_humidity
      - sensor.demo_room_7_co2
    # Optional: zusätzliche Temperatur direkt vor dem Außensensor
    - - Zusatz
      - sensor.demo_extra_temperature
      - null
      - null
    - - Außen
      - sensor.demo_room_8_temperature
      - sensor.demo_room_8_humidity
      - null
      - sensor.demo_room_8_rain
    allow_night_action: false
    night_script: script.demo_good_night
    calendars:
    - calendar.demo_1
    - calendar.demo_2
    - calendar.demo_3
    - calendar.demo_4
    - calendar.demo_5
    price_factor: 100
    radar:
      type: custom:weather-radar-card
      height: 100%
      zoom_level: 8
      data_source: DWD
      past_minutes: 60
      forecast_minutes: 60
      forecast_refresh_minutes: 15
    entities:
      current_price: sensor.demo_current_price
      pv_power: sensor.demo_pv_power
      pv_energy_today: sensor.demo_pv_energy_today
      electricity_consumption_today: sensor.demo_electricity_consumption_today
      electricity_cost_today: sensor.demo_electricity_cost_today
      vehicle_range: sensor.demo_vehicle_range
      vehicle_soc: sensor.demo_vehicle_soc
      vehicle_plug: binary_sensor.demo_vehicle_plug
      vehicle_charging: binary_sensor.demo_vehicle_charging
      vehicle_target_soc: sensor.demo_vehicle_target_soc
      vehicle_charged_today: sensor.demo_vehicle_charged_today
    vehicle_name: Demoauto
    # Optional ab V2.1.2: Name aus einem eigenen Text-Helfer
    # vehicle_name_entity: input_text.demo_vehicle_name

- title: Heizung
  path: heating
  icon: mdi:radiator
  panel: true
  cards:
    - type: custom:home-dashboard
      view: heating
      heating:
        switches:
          - name: Automatik 1
            entity: input_boolean.demo_heating_1
          - name: Automatik 2
            entity: input_boolean.demo_heating_2
          - name: Automatik 3
            entity: input_boolean.demo_heating_3
          - name: Automatik 4
            entity: input_boolean.demo_heating_4
        thermostats:
          - name: Raum 1
            entity: climate.demo_heating_1
          - name: Raum 2
            entity: climate.demo_heating_2
          - name: Raum 3
            entity: climate.demo_heating_3
          - name: Raum 4
            entity: climate.demo_heating_4

name: Rebuild distribution

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create version tag and trigger release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: npm run build
      - run: npm run check
      - run: npm run check:dist
      - run: npm test

      - name: Commit distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Homedashboard-iPad.js
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild distribution"
            git push
          fi

      - name: Create version tag
        if: inputs.publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Publish release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" \
            dist/Homedashboard-iPad.js \
            --verify-tag \
            --title "Home Dashboard iPad v$VERSION" \
            --notes-file "docs/releases/v$VERSION.md"

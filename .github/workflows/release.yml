name: Build and release HACS card
on:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: home-dashboard-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Find the version tag
        id: version
        env:
          PUSHED_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          RELEASE_TAG="v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          if [ -n "$PUSHED_TAG" ] && [ "$PUSHED_TAG" != "$RELEASE_TAG" ]; then
            echo 'Package version and pushed tag disagree' >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo 'No version tag yet; publishing is deferred until the tag exists.'
          fi
      - name: Check out the tagged sources
        if: steps.version.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: git checkout --detach "$RELEASE_TAG"
      - name: Build and test the tagged version
        if: steps.version.outputs.tag != ''
        run: |
          npm run build
          npm run check
          npm run check:dist
          npm test
          git diff --exit-code -- dist/
      - name: Publish GitHub release with single-file card
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; leaving its assets unchanged.'
          else
            gh release create "$RELEASE_TAG" dist/Homedashboard-iPad.js --verify-tag --title "Home Dashboard iPad $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
